<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f8" id="theme-color-meta" />
    <title>SonicVault – Meditation & Klangwelten</title>
    <script>
      // Theme vor dem ersten Paint setzen (gespeichert, sonst System) – verhindert den Weiß-Blitz im Dunkeln.
      (function () {
        try {
          var t = localStorage.getItem('sonicvault-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.getElementById('theme-color-meta').setAttribute('content', t === 'dark' ? '#14161f' : '#f8f8f8');
        } catch (e) { /* noop */ }
      })();
    </script>
    <link rel="preload" href="/fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
